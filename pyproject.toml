[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molecfit-gui"
version = "0.1.3"
description = "Interfaz gráfica para Molecfit (4.4.2 vía EsoRex y 1.5.9 standalone) con normalización de espectros"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Ignacio Solís Muñoz" }]
dependencies = [
    "numpy>=1.21",
    "astropy>=5.0",
    "matplotlib>=3.5",
    "PySide6>=6.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
molecfit-gui-batch = "molecfit_gui.cli:main"

[project.gui-scripts]
molecfit-gui = "molecfit_gui.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
